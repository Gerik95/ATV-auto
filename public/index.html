<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      var search = window.location.search;
      if (!search || search.indexOf("spa-route=") === -1) return;

      var routeData = search.replace(/^\?/, "");
      var parts = routeData.split("&");
      var encodedPath = "";
      var encodedQuery = "";

      for (var i = 0; i < parts.length; i += 1) {
        var tuple = parts[i].split("=");
        if (tuple[0] === "spa-route") encodedPath = tuple[1] || "";
        if (tuple[0] === "spa-query") encodedQuery = tuple[1] || "";
      }

      if (!encodedPath) return;

      var restoredPath = decodeURIComponent(encodedPath);
      var restoredQuery = encodedQuery ? decodeURIComponent(encodedQuery) : "";
      var targetUrl = restoredPath + (restoredQuery ? "?" + restoredQuery : "") + window.location.hash;
      window.history.replaceState(null, "", targetUrl);
    })();
  </script>
